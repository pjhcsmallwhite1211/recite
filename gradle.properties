# Project-wide Gradle settings.

# 本机 JAVA_HOME 指向 JDK 8，Android 构建需要 JDK 17+，故显式固定 JDK 21。
org.gradle.java.home=D:/Program Files/Java/jdk-21
# Kotlin jvmToolchain(17) 需要的 JDK 安装位置（本机 JDK 装在 D 盘，不在 Gradle 默认扫描路径内）。
org.gradle.java.installations.paths=D:/Program Files/Java/jdk-17,D:/Program Files/Java/jdk-21

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Enables Gradle Build Cache.
org.gradle.caching=true
# Enables Gradle Configuration Cache.
org.gradle.configuration-cache=true
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Namespacing of each library's R class
android.nonTransitiveRClass=true
